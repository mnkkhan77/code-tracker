server:
  port: 8080

spring:
  devtools:
    restart:
      enabled: true
  datasource:
    url: ${DB_URL:}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc.time_zone: UTC
  logging:
    level:
      org.springframework.transaction: DEBUG
      org.hibernate.SQL: DEBUG
      org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:redis-10346.crce281.ap-south-1-3.ec2.cloud.redislabs.com}
      port: ${REDIS_PORT:10346}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: true
      timeout: 2000ms
      connect-timeout: 2000ms

filebase:
  access-key: ${FILEBASE_ACCESS_KEY:}
  secret-key: ${FILEBASE_SECRET_KEY:}
  bucket: ${FILEBASE_BUCKET:}

app:
  jwt:
    secret: ${JWT_SECRET:}
    access-validity-seconds: 86400   # 1 day
    refresh-validity-seconds: 604800 # 7d
  openai:
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:llama-3.3-70b-versatile}
  frontend-url: ${FRONTEND_URL:}

stripe:
  secret-key: ${STRIPE_SECRET_KEY:}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: alpha
    tagsSorter: alpha

logging:
  level:
    root: INFO
